.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(238,246,255,.02) 45%,rgba(8,35,74,.22) 100%);pointer-events:none}
.hero-note{position:relative;z-index:1;max-width:530px;color:white;text-shadow:0 1px 8px rgba(4,24,55,.35);font-size:14px;font-weight:600;letter-spacing:.02em}
.auth-side{display:flex;align-items:center;justify-content:center;padding:34px clamp(20px,4vw,64px);background:linear-gradient(145deg,#fff 0%,#f7faff 100%)}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #e6edf7;border-radius:22px;padding:clamp(24px,3vw,40px);box-shadow:0 18px 55px rgba(14,45,86,.11)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;color:var(--navy);font-weight:800;font-size:36px;letter-spacing:-1.7px}
.brand-symbol{width:43px;height:43px;flex:0 0 43px;display:block}
.brand-word span{color:var(--blue)}
h1{font-size:28px;letter-spacing:-.7px;text-align:center;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--muted);font-size:14px;line-height:1.55;text-align:center;margin:0 0 24px}
.tabs{display:flex;gap:5px;padding:4px;background:#f0f5fc;border-radius:12px;margin-bottom:20px}
.tabs button{flex:1;min-width:0;padding:10px 6px;border:0;background:transparent;border-radius:9px;color:#52647c;font-size:13px;font-weight:650;cursor:pointer}
.tabs button.on{background:#fff;color:#086cf0;box-shadow:0 2px 8px rgba(20,54,93,.10)}
label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px;color:#1c3150}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fff;color:#102747;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#2584fa;box-shadow:0 0 0 3px rgba(8,120,249,.12)}
button.primary{width:100%;margin-top:20px;padding:13px 16px;border:0;border-radius:11px;background:linear-gradient(100deg,#0878f9,#0862e7);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 7px 16px rgba(8,108,239,.18)}
button.primary:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:10px;display:none;overflow-wrap:anywhere}
.msg.err{display:block;background:#fee2e2;color:var(--red)}.msg.ok{display:block;background:#d1fae5;color:var(--green)}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.hidden{display:none!important}
.card-foot{text-align:center;font-size:12px;color:#8795a9;margin-top:22px}
@media(max-width:900px){.page{grid-template-columns:1fr}.hero{min-height:300px;height:34vh;max-height:400px;background-position:center 42%;padding:20px}.hero-note{font-size:12px}.auth-side{padding:28px 18px 36px}.card{max-width:480px}}
@media(max-width:480px){.hero{min-height:220px;height:28vh;background-position:center 43%}.hero-note{font-size:11px}.brand{font-size:31px;margin-bottom:18px}.brand-symbol{width:38px;height:38px;flex-basis:38px}h1{font-size:25px}.tabs button{font-size:12px}.card{padding:24px 20px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <section class="hero" aria-label="VYREX StockFlow product showcase">
    <div class="hero-note">Inventory · Sales · Costs · All in one place</div>
  </section>
  <main class="auth-side">
    <div class="card">
      <div class="brand" aria-label="VYREX"><svg class="brand-symbol" viewBox="0 0 64 64" role="img" aria-label="VYREX symbol" xmlns="http://www.w3.org/2000/svg"><path d="M13 7C5 15 5 28 10 39l8 16c2 4 7 3 9-1l5-10-8-15-5 10-5-11c-3-7-2-14 3-19z" fill="#00d889"/><path d="M22 8h11l11 28 8-21c2-5 7-7 11-4l-18 45c-2 5-8 5-10 0L22 8z" fill="#00c978"/><path d="M45 8h9c5 0 8 4 7 9l-3 8-8 2 4-10h-7z" fill="#00e092"/></svg><span class="brand-word">vyrex</span></div>
      <h1>Stock<span style="color:#00a85a">Flow</span></h1>
      <p class="sub" id="sub">Sign in to your stock account</p>
      <div class="tabs" id="tabs">
        <button type="button" data-tab="login" class="on">Sign in</button>
        <button type="button" data-tab="register">Create account</button>
        <button type="button" data-tab="forgot">Forgot password</button>
      </div>
      <form id="f-login" novalidate>
        <label for="l-email">Email address</label><input id="l-email" type="email" autocomplete="email" placeholder="Enter your email address" required>
        <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <form id="f-register" class="hidden" novalidate>
        <label for="r-name">Full name</label><input id="r-name" type="text" autocomplete="name" placeholder="Enter your full name" required>
        <label for="r-email">Email address</label><input id="r-email" type="email" autocomplete="email" placeholder="Enter your email address" required>
        <label for="r-pass">Create password</label><input id="r-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <div class="hint">At least 8 characters.</div>
        <label for="r-pass2">Confirm password</label><input id="r-pass2" type="password" autocomplete="new-password" placeholder="Enter your password again" required>
        <button class="primary" type="submit">Create account →</button>
      </form>
      <form id="f-forgot" class="hidden" novalidate>
        <label for="g-email">Email address</label><input id="g-email" type="email" autocomplete="email" placeholder="Enter your email address" required>
        <div class="hint">We will email you a link to choose a new password.</div>
        <button class="primary" type="submit">Send reset link →</button>
      </form>
      <form id="f-reset" class="hidden" novalidate>
        <label for="p-pass">New password</label><input id="p-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <div class="hint">At least 8 characters.</div>
        <label for="p-pass2">Confirm new password</label><input id="p-pass2" type="password" autocomplete="new-password" placeholder="Enter your new password again" required>
        <button class="primary" type="submit">Set new password →</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div class="card-foot">Your store on one platform.</div>
    </div>
  </main>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token');
  function show(msg, kind){ const m=$('msg'); m.textContent=msg||''; m.className='msg'+(msg?' '+kind:''); }
  function setBusy(form, busy){ const b=form.querySelector('button.primary'); b.disabled=busy; }
  function showPanel(name){
    ['login','register','forgot','reset'].forEach(n=>$('f-'+n).classList.toggle('hidden', n!==name));
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
    $('tabs').classList.toggle('hidden', name==='reset');
    $('sub').textContent = {login:'Sign in to your stock account',register:'Create an account. You need your name, email and a password.',forgot:'Enter your email to reset your password.',reset:'Choose a new password.'}[name];
    show('', '');
  }
  async function post(path, body){
    const r = await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j={}; try{ j=await r.json(); }catch(_){}
    if(!r.ok) throw new Error(j.error || ('Request failed ('+r.status+')'));
    return j;
  }
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.tab)));

  $('f-login').addEventListener('submit', async e=>{
    e.preventDefault(); show('', ''); setBusy($('f-login'), true);
    try{ await post('/api/login',{email:$('l-email').value.trim(), password:$('l-pass').value}); location.replace('/dashboard'); }
    catch(err){ show(err.message,'err'); setBusy($('f-login'), false); }
  });
  $('f-register').addEventListener('submit', async e=>{
    e.preventDefault(); show('', '');
    const name=$('r-name').value.trim(), email=$('r-email').value.trim(), pw=$('r-pass').value, pw2=$('r-pass2').value;
    if(name.length<2){ show('Enter your name (at least 2 characters).','err'); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ show('Enter a valid email address.','err'); return; }
    if(pw.length<8){ show('Password must be at least 8 characters.','err'); return; }
    if(pw!==pw2){ show('The two passwords do not match.','err'); return; }
    setBusy($('f-register'), true);
    try{ await post('/api/register',{name,email,password:pw}); location.replace('/dashboard'); }
    catch(err){ show(err.message,'err'); setBusy($('f-register'), false); }
  });
  $('f-forgot').addEventListener('submit', async e=>{
    e.preventDefault(); show('', ''); setBusy($('f-forgot'), true);
    try{ const j=await post('/api/forgot',{email:$('g-email').value.trim()}); show(j.message,'ok'); }
    catch(err){ show(err.message,'err'); }
    setBusy($('f-forgot'), false);
  });
  $('f-reset').addEventListener('submit', async e=>{
    e.preventDefault(); show('', '');
    const pw=$('p-pass').value, pw2=$('p-pass2').value;
    if(pw.length<8){ show('Password must be at least 8 characters.','err'); return; }
    if(pw!==pw2){ show('The two passwords do not match.','err'); return; }
    setBusy($('f-reset'), true);
    try{ const j=await post('/api/reset',{token,password:pw}); show(j.message,'ok'); history.replaceState(null,'','/auth.html'); setTimeout(()=>{ showPanel('login'); show(j.message,'ok'); }, 0); }
    catch(err){ show(err.message,'err'); }
    setBusy($('f-reset'), false);
  });

  // Already signed in? Go straight to the app.
  fetch('/api/me',{credentials:'same-origin'}).then(r=>{ if(r.ok && !token) location.replace('/dashboard'); }).catch(()=>{});
  showPanel(token ? 'reset' : 'login');
})();
</script>
</body>
</html>
